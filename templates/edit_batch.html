{% extends "base.html" %}
{% block title %}تعديل شحنة{% endblock %}
{% block content %}
<h5 class="page-title mb-3"><i class="fa-solid fa-pen me-1"></i> تعديل شحنة - {{ batch.medicine.name }}</h5>
<div class="card p-3">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">الكمية</label>
      <input type="number" name="quantity" class="form-control" min="0" value="{{ batch.quantity }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">تاريخ انتهاء الصلاحية</label>
      <input type="date" name="expire_date" class="form-control" value="{{ batch.expire_date.isoformat() if batch.expire_date }}" required>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-brand"><i class="fa-solid fa-floppy-disk me-1"></i>حفظ</button>
      <a href="{{ url_for('medicine_batches', medicine_id=batch.medicine_id) }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
