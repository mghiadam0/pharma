<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - إدارة المخزون الطبي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
  body{ background:#0f766e; font-family:"Segoe UI",Tahoma,sans-serif; }
  .login-card{ border:0; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  .form-control{ min-height:48px; }
  .btn-brand{ background:#0f766e; color:#fff; min-height:48px; }
</style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="col-12 col-sm-9 col-md-5">
    <div class="card login-card p-4">
      <div class="text-center mb-3">
        <i class="fa-solid fa-suitcase-medical fa-2x" style="color:#0f766e"></i>
        <h4 class="mt-2 fw-bold" style="color:#115e59">إدارة المخزون الطبي</h4>
        <p class="text-muted small mb-0">الرجاء تسجيل الدخول للمتابعة</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100 fw-bold">تسجيل الدخول</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
