{% extends "base.html" %}
{% block title %}إضافة دواء{% endblock %}
{% block content %}
<h5 class="page-title mb-3"><i class="fa-solid fa-plus me-1"></i> إضافة دواء</h5>
<div class="card p-3">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">اسم الدواء</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">الحد الأدنى للمخزون</label>
      <input type="number" name="min_stock" class="form-control" min="0" value="0" required>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-brand"><i class="fa-solid fa-floppy-disk me-1"></i>حفظ</button>
      <a href="{{ url_for('medicines') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
