{% extends "base.html" %}
{% block title %}التنبيهات{% endblock %}
{% block content %}
<h5 class="page-title mb-3"><i class="fa-solid fa-bell me-1"></i> التنبيهات</h5>
<div class="card p-3">
  {% if alerts %}
  <div class="small text-muted mb-2">تنبيهات النظام النشطة:</div>
  <ul class="list-group list-group-flush">
    {% for a in alerts %}
    <li class="list-group-item px-0">
      <span class="badge bg-{{ a.category }} me-1">{{ a.type }}</span>
      <span>{{ a.text }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-muted mb-0">لا توجد تنبيهات حالياً.</p>
  {% endif %}
</div>
{% endblock %}
