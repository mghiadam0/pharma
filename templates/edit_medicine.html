{% extends "base.html" %}
{% block title %}تعديل دواء{% endblock %}
{% block content %}
<h5 class="page-title mb-3"><i class="fa-solid fa-pen me-1"></i> تعديل دواء</h5>
<div class="card p-3">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">اسم الدواء</label>
      <input type="text" name="name" class="form-control" value="{{ med.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">الحد الأدنى للمخزون</label>
      <input type="number" name="min_stock" class="form-control" min="0" value="{{ med.min_stock }}" required>
    </div>
    <div class="alert alert-light border py-2 small mb-3">الكمية الحالية: <strong>{{ med.total_quantity }}</strong></div>
    <div class="d-flex gap-2">
      <button class="btn btn-brand"><i class="fa-solid fa-floppy-disk me-1"></i>حفظ التعديلات</button>
      <a href="{{ url_for('medicines') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
